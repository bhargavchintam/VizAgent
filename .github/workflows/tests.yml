name: tests

# Offline: the tests use fakes and fixture data, so no event VM, VSS, W&B or GPU credentials are needed.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            app/requirements.txt
      - name: Install the dev requirements
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest
